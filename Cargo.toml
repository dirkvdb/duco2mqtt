[package]
edition = "2024"
name = "duco2mqtt"
version = "1.0.1"
default-run = "duco2mqtt"

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
bytes = "1.11"
env_logger = "0.11"
tokio = { version = "1.49", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
log = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
clap-verbosity-flag = "3.0"
rumqttc = "0.25"
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "rustls",
] }
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
strum = { version = "0.27", features = ["derive"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
