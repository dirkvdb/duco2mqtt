[package]
name = "duco2mqtt"
version = "1.0.1"
edition = "2024"
default-run = "duco2mqtt"

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
async-trait = "0.1"
bytes = "1.11"
clap = { version = "4.5", features = ["derive", "env"] }
clap-verbosity-flag = "3.0"
env_logger = "0.11"
log = "0.4"
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "rustls",
] }
rumqttc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.49", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
